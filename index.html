<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1e1b4b;font-family:"Trebuchet MS","Segoe UI",Roboto,sans-serif;color:#1f2937}
#app{max-width:480px;margin:0 auto;min-height:100%;background:linear-gradient(180deg,#7dd3fc 0%,#c4b5fd 55%,#fbcfe8 100%);position:relative;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
.screen{display:none;padding:12px 14px 90px}.screen.active{display:block}
.topbar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 #a78bfa;margin-bottom:12px}
.topbar .nm{font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:#fef3c7;border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px}
.pill.gem{background:#e0e7ff}
h1{font-size:30px;text-align:center;color:#fff;text-shadow:0 3px 0 #7c3aed,0 6px 12px #0004;margin:10px 0}
h2{margin:6px 0 10px;color:#4c1d95}
.card{background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 4px 0 #c4b5fd}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:16px;padding:12px 14px;font-size:16px;font-weight:800;color:#fff;background:#8b5cf6;box-shadow:0 4px 0 #5b21b6;cursor:pointer;font-family:inherit;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5b21b6}
.btn.big{padding:18px 10px;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:4px}
.btn.big .ic{font-size:30px}
.btn.green{background:#22c55e;box-shadow:0 4px 0 #15803d}.btn.orange{background:#f97316;box-shadow:0 4px 0 #c2410c}
.btn.blue{background:#3b82f6;box-shadow:0 4px 0 #1d4ed8}.btn.pink{background:#ec4899;box-shadow:0 4px 0 #be185d}
.btn.gray{background:#94a3b8;box-shadow:0 4px 0 #64748b}.btn.small{padding:7px 10px;font-size:13px;width:auto}
.btn:disabled{opacity:.5}
.back{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(452px,calc(100% - 28px));z-index:5}
input[type=text]{width:100%;font-size:20px;padding:12px;border-radius:14px;border:3px solid #a78bfa;font-family:inherit}
.row{display:flex;align-items:center;gap:8px}.row>.grow{flex:1}
.muted{color:#6b7280;font-size:13px}.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:#ede9fe;color:#5b21b6;margin-right:4px}
.tag.warn{background:#fee2e2;color:#b91c1c}.tag.ok{background:#dcfce7;color:#166534}
.bar{height:10px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#a3e635)}
.swatch{width:34px;height:34px;border-radius:50%;flex:none;border:3px solid #fff;box-shadow:0 0 0 2px #ddd}
.locked{opacity:.55;filter:grayscale(.6)}
canvas#lane{display:block;margin:0 auto;border-radius:14px;box-shadow:0 4px 0 #6d28d9;max-width:100%;touch-action:none}
.scorecard{width:100%;border-collapse:collapse;background:#fff;font-size:12px;margin-top:6px;border-radius:10px;overflow:hidden;table-layout:fixed}
.scorecard td{border:1px solid #ddd6fe;text-align:center;padding:0;height:34px;vertical-align:top}
.scorecard td.n{width:64px;font-weight:800;font-size:11px;vertical-align:middle;padding:0 3px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.scorecard .mk{display:flex;justify-content:flex-end;font-weight:800;color:#7c3aed;height:15px}.scorecard .mk span{min-width:11px;border-left:1px solid #ede9fe}
.scorecard .sc{font-weight:800;font-size:13px}.scorecard td.cur{background:#fef9c3}.scorecard td.tot{width:38px;font-weight:900;font-size:14px;vertical-align:middle;background:#f5f3ff}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.show{display:flex}.modal .card{max-width:420px;width:100%;max-height:85vh;overflow:auto}
.banner{background:#fde68a;border:2px dashed #f59e0b;border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px;text-align:center;margin-bottom:10px}
.dialog{background:#fff;border-radius:16px;padding:10px 12px;position:relative;margin:6px 0 10px 60px;font-style:italic}
.dialog:before{content:"";position:absolute;left:-12px;top:14px;border:7px solid transparent;border-right-color:#fff}
.av{position:absolute;left:-62px;top:-4px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}.tabs .btn{flex:1;font-size:13px;padding:9px 6px}
.tabs .btn.sel{background:#4c1d95}
table.lb{width:100%;border-collapse:collapse;font-size:14px}table.lb td,table.lb th{padding:6px 4px;border-bottom:1px solid #eee;text-align:left}
table.lb tr.you{background:#fef9c3;font-weight:800}
.speed{display:flex;gap:6px;justify-content:center;margin:8px 0}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3 .btn.big{padding:12px 4px;font-size:13px}.grid3 .btn.big .ic{font-size:26px}
.adbanner{margin-top:8px;background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 10px,#e2e8f0 10px,#e2e8f0 20px);border:2px dashed #94a3b8;border-radius:10px;font-size:11px;font-weight:800;color:#475569;text-align:center;padding:6px}
.patcard{border:3px solid #c4b5fd;border-radius:14px;padding:8px 10px;background:#faf5ff;margin:8px 0}
.patcard .oilbar{height:14px;border-radius:7px;background:#fde2b8;position:relative;overflow:hidden;margin:6px 0 2px}
.patcard .oilbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#60a5fa,#93c5fd);border-right:2px solid #1d4ed8}
.patcard .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;text-align:center}
.patcard .grid4 b{display:block;font-size:14px;color:#4c1d95}
.tag.sport{background:#fee2e2;color:#b91c1c}.tag.house{background:#dcfce7;color:#166534}.tag.challenge{background:#fef3c7;color:#92400e}
.brock{border:3px solid #facc15;background:linear-gradient(135deg,#fff7cc,#fff)}
.adfull{text-align:center;padding:30px 10px;background:repeating-linear-gradient(45deg,#e0f2fe,#e0f2fe 14px,#bae6fd 14px,#bae6fd 28px);border-radius:14px;font-weight:900;color:#0c4a6e}

/* ---- PWA / touch (v0.2.1) ---- */
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;font-size:16px}
button,.btn,a,[data-go],[data-ch],select{touch-action:manipulation}
button,.btn,select{min-height:44px}
#match{touch-action:none;overscroll-behavior:contain}
#app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.toast{top:calc(10px + env(safe-area-inset-top))}
.modal .card{max-height:calc(100vh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));max-height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.sndbtn{width:44px;height:44px;min-height:44px;flex:none;border:0;border-radius:50%;background:#ede9fe;font-size:20px;cursor:pointer;padding:0;box-shadow:0 2px 0 #c4b5fd}
.sndbtn:active{transform:translateY(2px);box-shadow:none}
.toggle{min-width:64px}
.vol{margin-top:8px}.vol input[type=range]{accent-color:#7c3aed;height:32px;min-width:0}

/* ---- Guided tutorial + Coach Hal tips (v0.4) ---- */
.tut{position:fixed;inset:0;z-index:40;display:none}
.tut.show{display:block}
.tut svg{position:absolute;inset:0;width:100%;height:100%}
.tut-ring{position:fixed;z-index:41;border:3px solid #facc15;border-radius:18px;box-shadow:0 0 0 4px #facc1566,0 0 18px #facc15;pointer-events:none;animation:tutPulse 1.2s ease-in-out infinite}
@keyframes tutPulse{50%{box-shadow:0 0 0 8px #facc1533,0 0 26px #facc15}}
.tut-lift{position:relative;z-index:42}
.tut-bubble{position:fixed;left:50%;transform:translateX(-50%);width:min(452px,calc(100% - 20px));z-index:43;background:#fff;border-radius:20px;padding:12px;box-shadow:0 6px 0 #7c3aed,0 10px 30px #0006;border:3px solid #a78bfa}
.tut-bubble .hd{display:flex;gap:10px;align-items:flex-start}
.tut-bubble .hd canvas{flex:none;border-radius:50%;background:#ede9fe}
.tut-bubble .who{font-weight:900;color:#4c1d95;font-size:14px}
.tut-bubble .say{font-size:16px;line-height:1.35;margin-top:2px}
.tut-bubble .cnt{font-size:11px;font-weight:800;color:#7c3aed;white-space:nowrap}
.tut-bubble .bb{display:flex;gap:8px;margin-top:10px;align-items:center}
.tut-bubble .bb .btn{width:auto;flex:1}
.tut-bubble .bb .btn.gray{flex:0 0 auto;font-size:13px;padding:8px 12px}
.tut-bubble .hint{font-weight:800;color:#c2410c;font-size:14px;flex:1}
.tipwrap{position:fixed;inset:auto 0 calc(70px + env(safe-area-inset-bottom)) 0;z-index:15;pointer-events:none;display:none}
.tipwrap.show{display:block}
.tipwrap .tut-bubble{position:relative;pointer-events:auto;bottom:auto;box-shadow:0 5px 0 #22c55e,0 8px 22px #0005;border-color:#86efac}
.tutinline{border:3px solid #facc15;border-radius:16px;background:#fffbea;padding:4px 6px 0}
.tutmatch{position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(452px,calc(100% - 16px));z-index:12;display:flex;gap:8px;align-items:center;background:#fffbeaf2;border:3px solid #facc15;border-radius:14px;padding:5px 8px;font-size:13px;line-height:1.3;pointer-events:none;box-shadow:0 4px 12px #0004}
.tutmatch .tav canvas{display:block;border-radius:50%;background:#ede9fe}
/* v0.6 Friends / invite screen */
.refcode{font:900 38px/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:8px;color:#5b21b6;background:#f5f3ff;border:3px dashed #a78bfa;border-radius:14px;padding:10px 4px 10px 12px;margin:6px auto;user-select:all;-webkit-user-select:all}
.tier{padding:7px 0;border-top:1px solid #f1f5f9;gap:8px}.tier.done{opacity:.75}
.tierN{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#fde68a;font-weight:900;font-size:14px;flex:none}
.tier.done .tierN{background:#86efac}
#refIn{text-transform:uppercase;letter-spacing:5px;text-align:center;font-weight:900;font-family:ui-monospace,Menlo,Consolas,monospace}
.tier-badge{display:inline-block;color:#fff;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.3px}
.col-btns{display:flex;flex-direction:column;gap:4px;align-items:stretch}.prem-item{border-left:4px solid #a855f7}
</style></head>

    o.classList.add('show');
    if (els.length) { const top = Math.min(...els.map(e => e.getBoundingClientRect().top)), bot = Math.max(...els.map(e => e.getBoundingClientRect().bottom));
      if (top < 0 || bot > innerHeight) { if (bot - top < innerHeight - 220) window.scrollBy(0, (top + bot) / 2 - innerHeight / 2); else els[0].scrollIntoView({ block: 'center' }); } }
    tutLayout();
    const nx = $('#tutNext'); if (nx) nx.onclick = () => tutNext(alt);
    $('#tutSkip').onclick = () => { C.tutSkip(P); persist(); tutHide(); toast('Tutorial skipped. Replay it anytime in ⚙️ Settings.'); };
  }
  function tutNext(alt) {
    const st = C.tutStep(P); if (!st) return;
    if (st.last) { const got = C.tutComplete(P); persist(); tutHide(); if (got) sfx('coin', { delay: 0.1 }); show(current);
      modal(`<h2>🎓 Tour complete!</h2>` + dialog(hal().look, `Coach Hal: "${got ? `Here's ${got} coins to get you started. ` : ''}I'll pop in with a quick tip the first time you open a new screen. Go get 'em!"`), [{ label: "Let's bowl!", cls: 'green' }]); fillAvatars($('#modal')); return; }
    if (alt && st.altSkipTo) C.tutGoto(P, st.altSkipTo); else C.tutAdvance(P);
    persist(); const nx = C.tutStep(P);
    if (nx && nx.screen !== current && nx.screen !== 'match') show(nx.screen); else tutRefresh();
  }
  // Called after every screen change and modal close: decides whether the tour bubble or a one-time tip should show.
  function tutRefresh() {
    if (!P || !P.tutorial) return;
    const modalOpen = $('#modal').classList.contains('show');
    if (C.tutActive(P)) {
      let st = C.tutStep(P);
      if (st && st.screen !== current && st.backTo && current === 'hub') { C.tutGoto(P, st.backTo); persist(); st = C.tutStep(P); }
      if (!st || modalOpen || st.screen !== current) { tutHide(); tipHide(); return; }
      return tutRender();
    }
    tutHide(); if (modalOpen) return tipHide();
    if (C.tipDue(P, current)) showTip(current); else if (!($('#tipWrap') && $('#tipWrap').dataset.for === current)) tipHide();
  }
  function showTip(id) {
    let w = $('#tipWrap'); if (!w) { w = document.createElement('div'); w.id = 'tipWrap'; w.className = 'tipwrap'; document.body.appendChild(w); }
    w.dataset.for = id; w.innerHTML = `<div class="tut-bubble" id="tipBubble">${halHead(esc(D.TUTORIAL.tips[id]), '💡 Tip')}<div class="bb"><button class="btn green" id="tipOk">Got it!</button><button class="btn gray" id="tipOff">No more tips</button></div></div>`;
    putHalAvatar(w); w.classList.add('show'); C.markTip(P, id); persist();
    $('#tipOk').onclick = () => tipHide();
    $('#tipOff').onclick = () => { C.setTips(P, false); persist(); tipHide(); toast('Tips off. Turn them back on in ⚙️ Settings.'); };
  }
  function modalTip(id) { if (!C.tipDue(P, id)) return ''; C.markTip(P, id); persist(); return `<div class="tutinline">${dialog(hal().look, `Coach Hal tip: "${esc(D.TUTORIAL.tips[id])}"`)}</div>`; }
  // Action steps: tapping the glowing target advances the tour before the button's own handler runs.
  document.addEventListener('click', e => {
    if (!P || !TUT.action || !C.tutActive(P) || !$('#tut') || !$('#tut').classList.contains('show')) return;
    const hit = (TUT.els || []).find(el => el.contains(e.target)); if (!hit) return;
    TUT.action = false; tutHide(); C.tutAdvance(P); persist();
  }, true);
  window.addEventListener('resize', () => tutLayout()); window.addEventListener('scroll', () => tutLayout(), { passive: true });
  function tutBootFix() {
    if (!P) return;
    if (P.tutorial.status === 'new') C.tutStart(P);
    const st = C.tutStep(P); if (st && st.screen !== 'hub') C.tutGoto(P, st.id === 'afterMatch' ? 'daily' : 'story');
  }
  function offerTour() {
    modal(`<h2>🎓 New: Coach Hal's tour</h2>` + dialog(hal().look, `Coach Hal: "Want a quick tour of everything in Pin Masters? It takes about a minute${P.tutorial.rewarded ? '' : ` and pays ${D.TUTORIAL.reward} coins`}."`),
      [{ label: 'Take the tour', cls: 'green', id: 'tourYes', fn: () => { C.tutStart(P); persist(); show('hub'); } }, { label: 'No thanks', cls: 'gray', id: 'tourNo', fn: () => { C.tutDecline(P); persist(); toast('No problem! You can take it later in ⚙️ Settings.'); tutRefresh(); } }]);
    fillAvatars($('#modal'));
  }

  // ---------- Boot ----------
  function boot() {
    document.querySelectorAll('.screen:not(#create):not(#match)').forEach(s => { const b = document.createElement('button'); b.className = 'btn gray back'; b.textContent = '⬅ Home'; b.onclick = () => show('hub'); s.after(b); b.dataset.for = s.id; });
    const obs = new MutationObserver(() => document.querySelectorAll('.back').forEach(b => (b.style.display = $('#' + b.dataset.for).classList.contains('active') && b.dataset.for !== 'hub' ? 'block' : 'none')));
    document.querySelectorAll('.screen').forEach(s => obs.observe(s, { attributes: true, attributeFilter: ['class'] }));
    document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button, .btn, select, canvas[style*="pointer"]'); if (!b || b.disabled) return; if (b.classList.contains('sndbtn')) show('settings'); sfx('click'); });
    captureRefParam();
    P = C.load(); if (P && !P.version) P = null;
    if (P) { C.unlockSkills(P); C.restorePurchases(P, localStorage); C.dailyCheck(P, now()); tutBootFix(); persist(); show('hub');
      const next = () => { bootServices(); if (C.tutShouldOffer(P)) offerTour(); };
      if (!P.privacy.ageGroup) askAge(next); else next(); } else show('create');
  }
  window.StrikeQuest = window.PinMasters = { getPlayer: () => P, online: () => online, refSync, audio: AU, show, toast, laneDemo, preMatch, save: persist, version: D.APP_VERSION,
    tutorial: { step: () => (C.tutStep(P) || {}).id || null, state: () => P && P.tutorial, refresh: tutRefresh } };
  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
<script>/*PWA*/
(function(){
  // Service worker: offline play when served over http(s) (not file://, not inside the native wrapper).
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW', e); }); });
  }
  // Ask the browser to keep localStorage saves (reduces eviction risk).
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
  // No double-tap zoom / pinch zoom on iOS Safari.
  var last = 0; document.addEventListener('touchend', function(e){ var n = Date.now(); if (n - last < 350 && !e.target.closest('input,textarea,select')) e.preventDefault(); last = n; }, { passive: false });
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  // No scrolling/bouncing while a match is playing.
  document.addEventListener('touchmove', function(e){ var m = document.getElementById('match'); if (m && m.classList.contains('active') && !document.getElementById('modal').classList.contains('show')) e.preventDefault(); }, { passive: false });
  // Save when the app is backgrounded/closed.
  document.addEventListener('visibilitychange', function(){ if (document.hidden && window.PinMasters && PinMasters.save) try { PinMasters.save(); } catch (e) {} });
  if (window.navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');
})();
</script>
